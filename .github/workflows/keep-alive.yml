name: Anti-Sleep KeepAlive Cron

on:
  schedule:
    # Runs every 12 hours (00:00 and 12:00 UTC) to prevent Supabase & Worker sleep with minimal load
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main

jobs:
  keepalive-ping:
    name: Ping Cloudflare Worker & Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping Customer Website & Cloudflare Edge
        run: |
          echo "=================================================="
          echo "Executing Anti-Sleep Ping to Customer Website..."
          echo "Timestamp: $(date -u)"
          
          WEB_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -I https://umrah-taxi-web.pages.dev/)
          echo "Customer Site Response Status Code: $WEB_RESPONSE"
          if [ "$WEB_RESPONSE" -eq 200 ]; then
            echo "✅ Customer Website (umrah-taxi-web) is ALIVE and WARM!"
          else
            echo "⚠️ Customer Website returned status: $WEB_RESPONSE"
          fi

      - name: Ping Admin Operations Portal
        run: |
          echo "=================================================="
          echo "Executing Anti-Sleep Ping to Admin Portal..."
          echo "Timestamp: $(date -u)"
          
          ADMIN_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -I https://umrah-taxi-admin.pages.dev/)
          echo "Admin Portal Response Status Code: $ADMIN_RESPONSE"
          if [ "$ADMIN_RESPONSE" -eq 200 ]; then
            echo "✅ Admin Portal (umrah-taxi-admin) is ALIVE and WARM!"
          else
            echo "⚠️ Admin Portal returned status: $ADMIN_RESPONSE"
          fi

      - name: Ping Cloudflare Worker Keep-Alive Endpoint
        run: |
          echo "=================================================="
          echo "Executing Anti-Sleep Ping to Cloudflare Worker..."
          echo "Timestamp: $(date -u)"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://umrah-taxi-web.umrahproj.workers.dev/api/ping)
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Cloudflare Worker is ALIVE and WARM!"
          else
            echo "⚠️ Worker returned status: $HTTP_STATUS"
          fi

      - name: Ping Supabase Database Gateway
        run: |
          echo "=================================================="
          echo "Executing Anti-Pause Ping to Supabase PostgreSQL..."
          echo "Timestamp: $(date -u)"
          
          SB_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -I https://lbfmxgnxihujjcrzhjzn.supabase.co/rest/v1/)
          echo "Supabase Response Status Code: $SB_RESPONSE"
          
          if [ "$SB_RESPONSE" -eq 401 ] || [ "$SB_RESPONSE" -eq 200 ]; then
            echo "✅ Supabase project is ACTIVE and AWAKE!"
          else
            echo "ℹ️ Supabase response code: $SB_RESPONSE"
          fi
          echo "=================================================="
